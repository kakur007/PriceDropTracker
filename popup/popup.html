<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Price Genius</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <img src="../assets/icons/apple-touch-icon-60x60.png" alt="" class="logo" width="26" height="26">
        <div>
          <h1>Price Genius</h1>
          <p class="tagline" id="tagline">Price tracking for any store</p>
        </div>
      </div>
      <div class="header-actions">
        <button id="refreshBtn" class="icon-btn" title="Check all prices now" aria-label="Check all prices now">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-1.9-4.6M16.5 3.5v3.8h-3.8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="themeToggleBtn" class="icon-btn" title="Theme" aria-label="Switch theme">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3a7 7 0 1 0 0 14V3Z" fill="currentColor"/><circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
        </button>
        <button id="settingsBtn" class="icon-btn" title="Settings" aria-label="Open settings">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="2.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 2.5v2M10 15.5v2M17.5 10h-2M4.5 10h-2M15.3 4.7l-1.4 1.4M6.1 13.9l-1.4 1.4M15.3 15.3l-1.4-1.4M6.1 6.1 4.7 4.7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <!-- What's on the current tab -->
    <section id="pageCard" class="page-card" aria-live="polite">
      <div class="page-loading"><span class="spinner"></span>Looking for a product on this page…</div>
    </section>

    <!-- Tracked products -->
    <section class="list-section">
      <div class="toolbar" id="toolbar" hidden>
        <div class="search">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m13.2 13.2 3.3 3.3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <input id="searchInput" type="search" placeholder="Search tracked products" aria-label="Search tracked products" autocomplete="off">
        </div>
        <select id="sortSelect" aria-label="Sort products">
          <option value="recent">Recent</option>
          <option value="drop">Biggest drop</option>
          <option value="price-asc">Price ↑</option>
          <option value="price-desc">Price ↓</option>
          <option value="name">Name</option>
        </select>
      </div>

      <div class="chips" id="filterChips" role="tablist" hidden>
        <button class="chip active" data-filter="all" role="tab" aria-selected="true">All <span id="countAll">0</span></button>
        <button class="chip" data-filter="drops" role="tab" aria-selected="false">Price drops <span id="countDrops">0</span></button>
        <button class="chip" data-filter="attention" role="tab" aria-selected="false">Needs attention <span id="countAttention">0</span></button>
      </div>

      <div id="productsList" class="products-list" role="list"></div>

      <div id="emptyState" class="empty-state" hidden>
        <div class="empty-art" aria-hidden="true">
          <svg viewBox="0 0 64 64"><rect x="10" y="18" width="44" height="34" rx="8" fill="currentColor" opacity=".12"/><path d="M20 40l8-8 6 6 10-12" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <h2>No products tracked yet</h2>
        <p>Open a product in any online store, then press <strong>Track price</strong> above. We'll check it in the background and tell you when it drops.</p>
      </div>
    </section>

    <footer class="footer">
      <button id="historyBtn" class="link-btn">Price history &amp; charts</button>
      <span id="lastCheck" class="muted"></span>
    </footer>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="popup.js"></script>
</body>
</html>
